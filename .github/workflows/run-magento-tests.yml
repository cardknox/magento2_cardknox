name: Magento2 Build, PHPUnit Tests & PHP CodeSniffer

on:
  push:
    branches-ignore:
      - 'master'
      - 'rc/*/*/*'
  pull_request:
    types:
      - opened

jobs:
  magento2-build:
    runs-on: ubuntu-latest
    name: Magento2 Build, PHPUnit Tests & PHP CodeSniffer

    services:
      mysql:
        image: docker://mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: magento
          MYSQL_DATABASE: magento
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      opensearch:
        image: ghcr.io/mad-i-t/magento-opensearch:2.5.0
        ports:
          - 9200:9200
        options: -e="discovery.type=single-node" -e "plugins.security.disabled=true" -e "plugins.security.ssl.http.enabled=false" --health-cmd="curl http://localhost:9200/_cluster/health" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
    - uses: actions/checkout@v3
      with:
        path: Cardknox
        # This workflow never pushes back to the repository, so the
        # GITHUB_TOKEN must not be left in the runner's git config where
        # later steps and third-party actions could read it.
        persist-credentials: false

    # Add PHP setup step
    - name: Setup PHP
      # Pinned to a commit SHA rather than the mutable v2 tag.
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.5'
        extensions: mbstring, intl, gd, xml, soap, zip, bcmath, opcache, pdo_mysql, curl, dom, hash, iconv, json, simplexml, xsl, xmlreader, xmlwriter, session
        tools: composer:v2

    - name: Download Magento Directly
      run: |
        set -e
        # Fetch Magento 2.4.9 and verify the commit the tag resolves to.
        # A commit SHA is cryptographically stable, whereas GitHub's
        # generated archives are not guaranteed to stay byte-identical,
        # so a checksum over the zip would be brittle here.
        EXPECTED_COMMIT="755e34dd689021c5165db9d35ecff74f7dc51527"
        git clone --depth 1 --branch 2.4.9 https://github.com/magento/magento2.git magento
        ACTUAL_COMMIT="$(git -C magento rev-parse HEAD)"
        if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
          echo "Magento commit mismatch: expected $EXPECTED_COMMIT, got $ACTUAL_COMMIT" >&2
          exit 1
        fi
        rm -rf magento/.git

    - name: Install Dependencies
      run: |
        cd magento
        composer install --no-interaction --prefer-dist
        # Install Magento2 Coding Standard for PHPCS
        composer require --dev magento/magento-coding-standard --no-interaction

    - name: Install MSI (Multi-Source Inventory) Modules
      run: |
        set -e
        EXPECTED_SHA="b121d7ce6067ca297e313c1b71981275cb01bd0c6f8a3e9fc00250d8b9354a46dccafd500a15c5246d2f60194392a2f7e9c6f8786fec59762e3d44a12601a1af"
        wget https://github.com/magento/inventory/archive/refs/tags/1.2.9.tar.gz -O inventory.tar.gz
        echo "$EXPECTED_SHA  inventory.tar.gz" | sha512sum -c -
        tar -xzf inventory.tar.gz
        mkdir -p magento/app/code/Magento
        cp -r inventory-1.2.9/Inventory* magento/app/code/Magento/
        rm -rf inventory.tar.gz inventory-1.2.9

    - name: Create Directories for Cardknox Module
      run: |
        mkdir -p magento/app/code/CardknoxDevelopment

    - name: Move Cardknox Module
      run: |
        mv Cardknox magento/app/code/CardknoxDevelopment

    - name: Enable Cardknox module
      run: |
        sudo php magento/bin/magento module:enable --all --clear-static-content
        sudo php magento/bin/magento setup:di:compile
        sudo chmod -R 777 magento/generated/ magento/var/ magento/pub/
        sudo php magento/bin/magento module:status CardknoxDevelopment_Cardknox

    - name: Run Unit Tests
      run: |
        cd magento
        # Remove Allure bootstrap to avoid config file warning
        sed -i '/<bootstrap class="Qameta\\Allure\\PHPUnit\\AllureExtension">/,/<\/bootstrap>/d' dev/tests/unit/phpunit.xml.dist
        php vendor/phpunit/phpunit/phpunit -c dev/tests/unit/phpunit.xml.dist app/code/CardknoxDevelopment/Cardknox/Test/

    - name: Run PHP CodeSniffer (PHPCS)
      run: |
        cd magento
        vendor/bin/phpcs --standard=Magento2 \
          --extensions=php,phtml \
          --report=full \
          app/code/CardknoxDevelopment/Cardknox/
